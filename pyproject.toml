[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tractor-simulator"
version = "0.1.0"
description = "A deterministic, observation-safe Tractor simulator for our table rules"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tractor-sim = "tractor_sim.__main__:main"

[tool.setuptools]
packages = ["tractor_sim"]
